<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霓虹 NEON · 场照作品</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0b10; color:#eee; font-family:"Noto Sans SC",sans-serif; padding:48px 5vw 60px; position:relative; }
  .glow { position:fixed; border-radius:50%; filter:blur(130px); opacity:.4; pointer-events:none; z-index:0; }
  .g1 { width:700px;height:700px; background:#5b2a86; top:-250px; left:-200px; }
  .g2 { width:600px;height:600px; background:#8a2b4a; bottom:-200px; right:-150px; }
  .wrap { position:relative; z-index:1; max-width:1280px; margin:0 auto; }
  a.back { display:inline-block; color:#b78cff; text-decoration:none; letter-spacing:2px; font-size:15px; margin-bottom:22px; }
  a.back:hover { color:#ff7ab8; }
  header { text-align:center; margin-bottom:40px; }
  header h1 { font-size:52px; font-weight:900; letter-spacing:6px;
    background:linear-gradient(92deg,#fff 20%,#b78cff 55%,#ff7ab8 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  header .sub { margin-top:12px; font-size:14px; letter-spacing:6px; color:#9a9ab0; }
  header .count { margin-top:16px; display:inline-block; font-size:13px; letter-spacing:2px; color:#ffb1d4;
    border:1px solid rgba(255,255,255,.25); padding:6px 18px; border-radius:20px; background:rgba(255,255,255,.04); }
  .grid { columns: 3 320px; column-gap:18px; }
  .ph { break-inside:avoid; margin-bottom:18px; border-radius:12px; overflow:hidden; position:relative; cursor:zoom-in;
    box-shadow:0 10px 34px rgba(0,0,0,.5); transition:transform .25s; }
  .ph:hover { transform:translateY(-4px) scale(1.01); }
  .ph img { width:100%; display:block; }
  .ph::after { content:""; position:absolute; inset:0; border-radius:12px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
  .ph .num { position:absolute; right:10px; bottom:10px; font-size:11px; letter-spacing:1px; padding:3px 9px; border-radius:14px;
    background:rgba(0,0,0,.55); color:#cfcfe4; border:1px solid rgba(255,255,255,.2); z-index:2; }
  /* lightbox */
  #lb { position:fixed; inset:0; background:rgba(5,5,10,.92); display:none; align-items:center; justify-content:center; z-index:50; }
  #lb.open { display:flex; }
  #lb img { max-width:92vw; max-height:88vh; border-radius:10px; box-shadow:0 20px 80px rgba(0,0,0,.8); }
  #lb .btn { position:fixed; top:50%; transform:translateY(-50%); font-size:34px; color:#fff; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2); border-radius:50%; width:56px; height:56px; line-height:50px; text-align:center; cursor:pointer; user-select:none; }
  #lb .prev { left:24px; } #lb .next { right:24px; }
  #lb .close { position:fixed; top:22px; right:30px; font-size:30px; color:#fff; cursor:pointer; }
  #lb .cnt { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); color:#b9b9d0; letter-spacing:2px; font-size:14px; }
  footer { margin-top:44px; text-align:center; border-top:1px solid rgba(255,255,255,.15); padding-top:24px; color:#a7a7c0; font-size:14px; letter-spacing:2px; line-height:2; }
  footer b { color:#ffb1d4; }

<style>
  /* ==== 专属主题装饰：霓虹 · NEON ==== */
  body::before { content:""; position:fixed; top:0; left:0; right:0; height:4px; z-index:60;
    background:linear-gradient(90deg,transparent,#00e5ff,#7ab8ff,#00e5ff,transparent); }
  .g1 { background:#0a3a5a; } .g2 { background:#0a5a6a; }
  header h1 { background:linear-gradient(92deg,#fff 15%,#00e5ff 55%,#7ab8ff 88%);
    -webkit-background-clip:text; background-clip:text; }
  a.back { color:#00e5ff; } a.back:hover { color:#7ab8ff; }
  header .count { color:#7ab8ff; border-color:#00e5ff55; }
  .ph::after { box-shadow:inset 0 0 0 1px #00e5ff30; }
  .ph:hover { box-shadow:0 14px 40px rgba(0,0,0,.55), 0 0 22px #00e5ff40; }
  footer b { color:#7ab8ff; }
  .emblem { text-align:center; margin-top:16px; font-size:15px; letter-spacing:12px; color:#00e5ff; opacity:.8; }
  .float { position:fixed; top:0; pointer-events:none; z-index:0; color:#00e5ff; opacity:.13;
    animation-name:drift; animation-timing-function:linear; animation-iteration-count:infinite; }
  @keyframes drift { from { transform:translateY(108vh) rotate(0deg); } to { transform:translateY(-14vh) rotate(330deg); } }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<span class="float" style="left:7.4vw;font-size:15px;animation-duration:17.5s;animation-delay:-24.0s">霓</span><span class="float" style="left:72.4vw;font-size:21px;animation-duration:23.5s;animation-delay:-8.5s">霓</span><span class="float" style="left:33.5vw;font-size:29px;animation-duration:17.2s;animation-delay:-18.7s">霓</span><span class="float" style="left:24.9vw;font-size:29px;animation-duration:18.8s;animation-delay:-7.7s">霓</span><span class="float" style="left:65.2vw;font-size:24px;animation-duration:15.0s;animation-delay:-2.0s">霓</span><span class="float" style="left:66.5vw;font-size:30px;animation-duration:20.8s;animation-delay:-3.7s">霓</span><span class="float" style="left:56.9vw;font-size:25px;animation-duration:24.5s;animation-delay:-24.9s">霓</span><span class="float" style="left:88.2vw;font-size:33px;animation-duration:16.1s;animation-delay:-7.9s">霓</span><span class="float" style="left:62.2vw;font-size:28px;animation-duration:14.8s;animation-delay:-0.6s">霓</span><div class="wrap">
  <a class="back" href="index.html">← 返回场照集</a>
  <header>
    <h1>霓虹 · NEON</h1>
    <div class="sub">VALORANT &nbsp;·&nbsp; 霓虹 NEON · 场照 &amp; 后期合成作品集</div>
    <div class="count">共 6 张 · 点击可放大浏览</div>
      <div class="emblem">· 霓 ·</div>
  </header>
  <div class="grid" id="grid"></div>
  <footer>
    摄影 &amp; 后期：<b>克劳德Cloud</b><br>
    微信：WilliamsCHY0124　｜　抖音：76991914498　｜　小红书：627195008
  </footer>
</div>
<div id="lb">
  <span class="close" onclick="closeLB()">✕</span>
  <span class="btn prev" onclick="step(-1)">‹</span>
  <img id="lbimg">
  <span class="btn next" onclick="step(1)">›</span>
  <div class="cnt" id="lbcnt"></div>
</div>
<script>
  const N = 6;
  const grid = document.getElementById('grid');
  for (let i = 1; i <= N; i++) {
    const d = document.createElement('div');
    d.className = 'ph';
    d.innerHTML = `<img src="n${i}.jpg" loading="lazy"><div class="num">${String(i).padStart(2,'0')} / ${N}</div>`;
    d.onclick = () => openLB(i);
    grid.appendChild(d);
  }
  let cur = 1;
  const lb = document.getElementById('lb'), img = document.getElementById('lbimg'), cnt = document.getElementById('lbcnt');
  function openLB(i){ cur=i; show(); lb.classList.add('open'); }
  function closeLB(){ lb.classList.remove('open'); }
  function step(d){ cur = (cur-1+d+N)%N + 1; show(); }
  function show(){ img.src = `n${cur}.jpg`; cnt.textContent = `${cur} / ${N}`; }
  lb.onclick = e => { if (e.target === lb) closeLB(); };
  document.onkeydown = e => { if(!lb.classList.contains('open')) return;
    if(e.key==='Escape') closeLB(); if(e.key==='ArrowLeft') step(-1); if(e.key==='ArrowRight') step(1); };
</script>
</body>
</html>
